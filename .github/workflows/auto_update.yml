name: Auto Update VPN Subscription

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Установка зависимостей
        run: |
          pip install requests

      - name: Запуск скрипта
        run: python auto_vpn.py

      - name: Сохранение результатов в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add happ_singbox.json
          git commit -m "Auto-update singbox config" || echo "No changes"
          git push
